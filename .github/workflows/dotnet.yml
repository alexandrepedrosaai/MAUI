name: .NET

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore MAUI workloads
        run: dotnet workload restore MauiApp1.csproj

      - name: Restore dependencies
        run: dotnet restore MauiApp1.csproj

      - name: Build Android app
        run: dotnet build MauiApp1.csproj --configuration Release --no-restore
